name: Build and Push to ECR

on:
  push:
    branches:
      - feature/docker

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloud-security-posture-explorer

jobs:

  debug:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Dump GitHub Context
        run: |
          echo "Repository=${{ github.repository }}"
          echo "Ref=${{ github.ref }}"
          echo "Actor=${{ github.actor }}"

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show OIDC identity claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          export TOKEN_JSON

          python3 - <<'PY'
          import base64
          import json
          import os

          token = json.loads(os.environ["TOKEN_JSON"])["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(
              payload + "=" * (-len(payload) % 4)
          ))
          for key in ("iss", "aud", "sub"):
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::980468996827:role/GitHubActionsECRPushRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .

      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:${{ github.sha }} \
          980468996827.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
          980468996827.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: Show Image Tag
        run: |
          echo "Image pushed:"
          echo "${{ github.sha }}"